name: xpBuild
permissions:
  contents: read
  pull-requests: write
on:
  push:
    tags: ["xpv*"]
  pull_request:
    branches: ["xpro"]
  workflow_dispatch:
jobs:
  linux:
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: externpro/externpro/.github/workflows/build-linux.yml@25.07.10
    with:
      artifact_pattern: ${{ github.event.repository.name }}-*.rpm
      buildpro_images: '["rocky9-gcc13"]'
      cmake_workflow_preset: LinuxRelease
    secrets:
      automation_token: ${{ secrets.GHCR_TOKEN }}
