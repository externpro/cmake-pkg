name: xpBuild
permissions:
  contents: read
  pull-requests: write
on:
  push:
    tags: ["xpv*"]
  pull_request:
    branches: ["xpro"]
  workflow_dispatch:
jobs:
  linux:
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: externpro/externpro/.github/workflows/build-linux.yml@main
    secrets:
      automation_token: ${{ secrets.GHCR_TOKEN }}
    with:
      artifact-pattern: ${{ github.event.repository.name }}-*.rpm
      buildpro-images: '["rocky9-gcc13"]'
      cmake-workflow-preset: LinuxRelease
